name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Test and publish Windows x64 release
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test SnapEdge.sln --configuration Release

      - name: Publish self-contained single-file executable
        shell: pwsh
        run: .\scripts\publish-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SnapEdge ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/release/SnapEdge.exe
